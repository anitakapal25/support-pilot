name: milestone-6
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: support
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U support -d support"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://support:ci-only-password@localhost:5432/support
      DATABASE_URL: postgresql+psycopg://support:ci-only-password@localhost:5432/support
      APP_ENV: development
      AGENT_PROVIDER: demo
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check backend tests
      - run: python -m ruff format --check backend tests
      - run: python -m pytest -q
      - run: python -m app.migrate
      - run: python -m alembic check
      - run: python -m app.seed
      - run: python -m app.ingest
      - run: python -m app.evaluate_retrieval
      - run: python -m app.evaluate_release --output evals/reports/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: evals/reports/ci/
          retention-days: 14
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: docker build -t support-pilot:ci .
