# Review costs and secrets before importing this Blueprint. No resources are auto-created by Git.
services:
  - type: web
    name: support-pilot
    runtime: docker
    plan: starter
    region: singapore
    repo: https://github.com/anitakapal25/support-pilot
    branch: main
    dockerContext: .
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: off
    preDeployCommand: python -m app.migrate
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: support-pilot-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: AGENT_PROVIDER
        value: openai
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: PILOT_ENABLED
        value: "false"
      - key: PILOT_ADMISSION_PERCENT
        value: "5"
      - key: REQUEST_LIMITS_ENABLED
        value: "true"
      - key: REQUESTS_PER_MINUTE
        value: "120"
      - key: CONVERSATIONS_PER_DAY
        value: "100"
      - key: SPEND_LIMITS_ENABLED
        value: "true"
      - key: MONTHLY_MODEL_BUDGET_USD
        value: "15"
      - key: RETENTION_DAYS
        value: "30"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: MODEL_INPUT_USD_PER_MILLION
        sync: false
      - key: MODEL_OUTPUT_USD_PER_MILLION
        sync: false
      - key: EMBEDDING_USD_PER_MILLION
        sync: false
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "256"
databases:
  - name: support-pilot-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "17"
    databaseName: support
    user: support
    diskSizeGB: 1
    ipAllowList: []
