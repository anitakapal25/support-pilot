# Hosted public demo on Render's free tier. Review before importing this Blueprint.
# Free-tier constraints this file accounts for:
# - no preDeployCommand: the container migrates and ingests on start (RUN_MIGRATIONS_ON_START)
# - no cron jobs: .github/workflows/maintenance.yml calls /api/internal/maintenance
# - the instance sleeps when idle; the first request after that takes about a minute
# - the free database expires 30 days after creation and has no backups (see README runbook)
services:
  - type: web
    name: support-pilot
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/anitakapal25/support-pilot
    branch: main
    dockerContext: .
    dockerfilePath: ./Dockerfile
    # Deploy only commits whose GitHub checks (CI) passed.
    autoDeployTrigger: checksPass
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: support-pilot-db
          property: connectionString
      - key: APP_ENV
        value: demo
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      # Only Render's proxy can reach the container, so its X-Forwarded-For is trusted.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: COOKIE_SECURE
        value: "true"
      - key: AGENT_PROVIDER
        value: openai
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "256"
      - key: PILOT_ENABLED
        value: "true"
      - key: PILOT_ADMISSION_PERCENT
        value: "100"
      - key: REQUEST_LIMITS_ENABLED
        value: "true"
      - key: REQUESTS_PER_MINUTE
        value: "30"
      - key: CONVERSATIONS_PER_DAY
        value: "100"
      - key: SPEND_LIMITS_ENABLED
        value: "true"
      - key: MONTHLY_MODEL_BUDGET_USD
        value: "5"
      - key: RETENTION_DAYS
        value: "7"
      - key: GUEST_TTL_HOURS
        value: "24"
      - key: GUEST_SESSIONS_PER_IP_HOUR
        value: "5"
      - key: GUEST_SESSIONS_PER_DAY
        value: "100"
      # Random 256-bit value generated by Render; copy it into the GitHub secret too.
      - key: MAINTENANCE_TOKEN
        generateValue: true
      # Set in the dashboard. JSON list, e.g. ["https://support-pilot.onrender.com"]
      - key: ALLOWED_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      # Current USD prices per million tokens for the chosen models (startup refuses unknown).
      - key: MODEL_INPUT_USD_PER_MILLION
        sync: false
      - key: MODEL_OUTPUT_USD_PER_MILLION
        sync: false
      - key: EMBEDDING_USD_PER_MILLION
        sync: false
databases:
  - name: support-pilot-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: support
    user: support
    # No external connections; only the web service (same region) can reach it.
    ipAllowList: []
