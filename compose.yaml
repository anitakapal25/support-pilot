name: support-pilot
x-backend: &backend
  image: support-pilot:local
  build: .
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-support}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-support}
    APP_ENV: ${APP_ENV:-development}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    AGENT_PROVIDER: ${AGENT_PROVIDER:-openai}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_MODEL: ${OPENAI_MODEL:-}
    MODEL_INPUT_TOKEN_LIMIT: ${MODEL_INPUT_TOKEN_LIMIT:-4096}
    MODEL_OUTPUT_TOKEN_LIMIT: ${MODEL_OUTPUT_TOKEN_LIMIT:-256}
    EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-demo}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
    EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-256}
    EVIDENCE_COVERAGE: ${EVIDENCE_COVERAGE:-0.7}
    ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["http://localhost:58000","http://localhost:8000","http://localhost:5173"]}'
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: ${POSTGRES_DB:-support}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    <<: *backend
    command: ["python", "-m", "app.migrate"]
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
  ingest:
    <<: *backend
    profiles: ["tools"]
    command: ["python", "-m", "app.ingest"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  seed:
    <<: *backend
    profiles: ["tools"]
    command: ["python", "-m", "app.seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
